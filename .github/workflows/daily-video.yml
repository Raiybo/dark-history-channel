name: Daily Did You Know Videos

on:
  # 6 reels/day (user override — the launch research recommended 2/day for the
  # first 30 days, but user chose 6/day to get back to the historical cadence).
  # Times target US Eastern peaks (EDT summer). Every 4 hours from 00:00 UTC.
  # Verified end-to-end on 2026-07-30 with the fixed RAG source feeds; first
  # live upload from the new Consumer Awareness pipeline:
  # https://www.youtube.com/watch?v=bekRb6n0ERE
  # ACTIVE 2026-08-05: 4 shorts/day, DATA-DRIVEN mix. Analysis of the first 11
  # uploads showed the two proven engines are (1) funny animal Top-5 [kingsranks]
  # — consistent 77-414 views — and (2) the head-to-head showdown [versus] — the
  # single biggest hit (664: "Paper Plane or Baseball") once topics are fun/visual
  # (dry science matchups flopped at ~2-26). rankinggame had no traction (0 views)
  # so it's dropped from the schedule (code kept for manual dispatch).
  # Slot map (UTC → US ET), alternating the two winners:
  #   13:00 UTC (09:00 ET) → kingsranks (funny animals)
  #   16:00 UTC (12:00 ET) → versus     (showdown)
  #   20:00 UTC (16:00 ET) → kingsranks (funny animals)
  #   00:00 UTC (20:00 ET) → versus     (showdown)
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 16 * * *'
    - cron: '0 20 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      genre:
        description: 'Which video to make'
        required: false
        default: 'kingsranks'
        type: choice
        options:
          - kingsranks
          - versus
          - rankinggame
          # clipranks: manual only. Commit 5 clips you OWN/LICENSED (Flow/Veo
          # output or licensed viral clips) to assets/clips/ with descriptive
          # names, then dispatch this. Never for scraped/reposted content.
          - clipranks

# Serialize ALL runs (scheduled + manual). Parallel runs race on idea-generation
# — they each read the same used-ideas.json before any has pushed, so Groq can
# return the same topic to multiple runs. With this lock, the next run waits
# for the current to finish and push, then starts with up-to-date state. Also
# prevents Groq's per-minute token budget from being hammered by parallel runs.
concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  generate-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium fonts-liberation
          echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium" >> $GITHUB_ENV

      - name: Install Python TTS
        run: pip3 install edge-tts

      - name: Install npm dependencies
        run: npm ci

      - name: Generate & upload one Did You Know reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CHANNEL_NAME: 'Kings of Ranks'
          # YouTube Studio session cookies (JSON array) — drives the post-upload
          # headless flow that flips the "don't show how many viewers like this
          # video" toggle. The flow no-ops gracefully if this is missing.
          YT_STUDIO_COOKIES: ${{ secrets.YT_STUDIO_COOKIES }}
          # TikTok draft delivery (optional — only acts if all three are set)
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          CI: 'true'
          UPLOAD: '1'
          # Slot → genre routing. Manual dispatch → chosen input.
          # Cron slot → one of (rankinggame | kingsranks | versus) per the map above.
          GENRE_OVERRIDE: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.genre
               || (github.event.schedule == '0 13 * * *' && 'kingsranks')
               || (github.event.schedule == '0 16 * * *' && 'versus')
               || (github.event.schedule == '0 20 * * *' && 'kingsranks')
               || (github.event.schedule == '0 0 * * *' && 'versus')
               || 'kingsranks' }}
        run: node src/main.js

      - name: Commit updated used-ideas.json
        if: always()
        run: |
          git config user.name "Distoir Bot"
          git config user.email "bot@distoir.auto"
          # Bail early if this run didn't add anything (e.g. failed before idea-gen).
          if git diff --quiet -- config/used-ideas.json; then
            echo "No local additions to commit."
            exit 0
          fi
          # Race-safe merge: another bot may have pushed entries while we ran.
          # Snapshot OUR additions, sync to latest remote, then merge both sides
          # by union (entries are objects so dedup on a composite key). With this
          # neither bot's additions are lost on a concurrent push.
          cp config/used-ideas.json /tmp/local-ideas.json
          git fetch origin main
          git reset --hard origin/main
          jq -s '
            (.[0] // []) + (.[1] // [])
            | unique_by((.title // "") + "|" + (.topic // "") + "|" + (.date // ""))
            | sort_by(.date // "")
          ' config/used-ideas.json /tmp/local-ideas.json > /tmp/merged-ideas.json
          mv /tmp/merged-ideas.json config/used-ideas.json
          git add config/used-ideas.json
          if git diff --staged --quiet; then
            echo "Local additions already on remote — nothing to push."
            exit 0
          fi
          git commit -m "chore: mark used topics [skip ci]"
          # One retry on push race (another bot may have pushed in the last few ms).
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push race, refreshing and retrying ($i/3)..."
            git pull --rebase -X theirs origin main || git rebase --abort
            sleep 2
          done
          echo "Push failed after retries."
          exit 1
